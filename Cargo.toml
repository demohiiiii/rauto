[package]
name = "rauto"
version = "0.5.0"
edition = "2024"
description = "A powerful CLI tool for network device automation using minijinja templates and rneter."
license = "Apache-2.0"
authors = ["demohiiiii <demonshide@qq.com>"]
repository = "https://github.com/demohiiiii/rauto"
readme = "README.md"
keywords = ["network", "automation", "cli", "ssh", "minijinja"]
categories = ["command-line-utilities", "network-programming"]
include = [
    "assets/**",
    "build.rs",
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "migrations/**",
    "proto/**",
    "README.md",
    "src/**",
    "static/**",
    "templates/**",
]

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1"
axum = { version = "0.8.1", features = ["multipart"] }
base64 = "0.22.1"
calamine = "0.31.0"
chrono = { version = "0.4.42", default-features = true, features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4.5.23", features = ["derive", "env"] }
cron = "0.15"
crossterm = "0.28"
csv = "1.3.1"
dirs = "5.0.1"
flate2 = "1.0.35"
futures-util = "0.3"
hostname = "0.4"
indicatif = "0.17"
ipnet = "2.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
log = "0.4.22"
mime_guess = "2.0.5"
minijinja = { version = "2.15", features = ["loader", "json"] }
prost = "0.14.3"
rand = "0.8.5"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rneter = "0.5.1"
rpassword = "7.3"
rust-embed = "8.5.0"
rust_xlsxwriter = "0.95.0"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
sha2 = "0.10"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
subtle = "2.6"
tar = "0.4.43"
textfsm-rust = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8.23"
tonic = { version = "0.14.5", features = ["transport"] }
tonic-prost = "0.14.5"
tower-http = { version = "0.6.2", features = ["fs"] }
tracing = "0.1.41"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[build-dependencies]
protoc-bin-vendored = "3.1.0"
tonic-build = "0.14.5"
tonic-prost-build = "0.14.5"

[dev-dependencies]
async-ssh2-tokio = "0.13"
rneter = { version = "0.5.1", features = ["testkit"] }
tower = { version = "0.5.2", features = ["util"] }
