[package]
name = "rauto"
version = "0.5.2"
edition = "2024"
rust-version = "1.94"
description = "A powerful CLI tool for network device automation using minijinja templates and rneter."
license = "Apache-2.0"
authors = ["demohiiiii <demonshide@qq.com>"]
repository = "https://github.com/demohiiiii/rauto"
readme = "README.md"
keywords = ["network", "automation", "cli", "ssh", "minijinja"]
categories = ["command-line-utilities", "network-programming"]
include = [
    "assets/**",
    "build.rs",
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "migrations/**",
    "proto/**",
    "README.md",
    "src/**",
    "static/**",
    "templates/**",
]

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
calamine = "0.36.1"
chrono = { version = "0.4.45", default-features = true, features = ["clock"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
cron = "0.17.0"
crossterm = "0.29.0"
csv = "1.4.0"
dirs = "7.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
hostname = "0.4.2"
indicatif = "0.18.6"
ipnet = "2.12.2"
keyring = "4.2.0"
log = "0.4.34"
mime_guess = "2.0.5"
# Pin the unstable AST API used to fill gaps in undeclared-variable analysis.
minijinja = { version = "=2.24.0", features = ["loader", "json", "unstable_machinery"] }
prost = "0.14.4"
rand = "0.10.3"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rneter = "0.5.2"
rpassword = "7.5.4"
rust-embed = { version = "8.12.0", features = ["compression"] }
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
subtle = "2.6.1"
tar = "0.4.46"
textfsm-rust = { version = "0.3.1", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"

[dev-dependencies]
async-ssh2-tokio = "0.13.0"
rneter = { version = "0.5.2", features = ["testkit"] }
tower = { version = "0.5.3", features = ["util"] }
