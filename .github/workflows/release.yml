name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: rauto
            asset_name: rauto-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rauto
            asset_name: rauto-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rauto
            asset_name: rauto-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rauto.exe
            asset_name: rauto-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config cmake

      - name: Setup MSVC tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web assets
        run: npm run web:build

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          # Use Rust's self-contained musl runtime without musl-gcc's loader path.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: cc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify standalone Linux binary
        if: runner.os == 'Linux'
        run: python3 -B scripts/check_linux_release.py target/${{ matrix.target }}/release/rauto

      - name: Verify macOS system-only dependencies
        if: runner.os == 'macOS'
        env:
          RELEASE_BINARY: target/${{ matrix.target }}/release/rauto
        run: |
          python3 - <<'PY'
          import os, subprocess
          binary = os.environ["RELEASE_BINARY"]
          output = subprocess.check_output(["otool", "-L", binary], text=True)
          print(output)
          for line in output.splitlines()[1:]:
              dependency = line.strip().split(" (", 1)[0]
              if not dependency.startswith(("/usr/lib/", "/System/Library/")):
                  raise SystemExit(f"Non-system dependency: {dependency}")
          subprocess.run([binary, "--version"], check=True)
          PY

      - name: Verify Windows static runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/rauto.exe"
          $imports = & dumpbin /dependents $binary
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect Windows dependencies" }
          $imports | Write-Output
          if ($imports -match '(?i)\b(vcruntime\w*|msvcp\w*|msvcr\d\w*|ucrtbase|api-ms-win-crt-[\w-]+)\.dll\b') {
            throw "Release binary depends on an external Visual C++ runtime"
          }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "Release binary cannot start" }

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          cd -

      - name: Checksum (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}
          cd -

      - name: Upload Release Asset (Linux/macOS)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = '${{ matrix.asset_name }}.zip'
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $archive" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Upload Release Asset (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.zip.sha256

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web assets
        run: npm run web:build

      - name: Verify tag matches Cargo.toml version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          TAG="${GITHUB_REF_NAME}"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "Tag (${TAG}) does not match Cargo.toml version (v${VERSION})"
            exit 1
          fi

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked --allow-dirty
